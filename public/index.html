<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to GPL Mods...</title>
    <link rel="icon" type="image/png" href="./assets/images/favicon.png">
    <link rel="apple-touch-icon" href="./assets/images/favicon.png">
    
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="/css/style.css">

</head>
<body>

    <!-- Parallax Card/Review Montage Layer -->
    <div id="montage-layer"></div>

    <!-- MAIN SLIDESHOW INTERFACE -->
    <div id="slideshow-container" class="show">
        <div class="logo-area">
            <span class="logo-gpl">GPL</span>
            <span class="logo-mods">Mods</span>
        </div>

        <div class="image-frame-wrapper" id="frame-wrapper">
            <div class="animated-frame" id="dynamic-frame">
                <!-- 1. Fallback Image for standard mod screenshots -->
                <img id="dynamic-image" src="" alt="Showcase Image" style="display: none;">
                
                <!-- 2. Model Viewer for 3D GLB Support -->
                <model-viewer id="dynamic-model" src="" auto-rotate rotation-per-second="30deg" interaction-prompt="none" shadow-intensity="1" style="display: none;"></model-viewer>
                
             <!-- ✅ FIX 1: Make absolutely certain all required autoplay bypass tags are present -->
            <video id="dynamic-video" preload="auto" loop muted playsinline autoplay style="display: none;"></video>
            </div>
        </div>

        <div class="message-container" id="message-wrapper">
            <div class="lottie-box">
                <!-- ✅ FIX: Set the initial src immediately so the component doesn't crash on boot -->
                <lottie-player id="dynamic-lottie" src="/assets/animations/welcome.json" background="transparent" speed="1" loop autoplay></lottie-player>
            </div>
            <div class="text-content-wrapper">
                <div id="dynamic-svg" class="custom-svg-icon"></div>
                <p id="dynamic-text">Waking up the server...</p>
            </div>
        </div>
    </div>

    <!-- PINGING / ERROR OVERLAY -->
    <div id="status-overlay">
        <lottie-player id="status-lottie" class="status-lottie" src="" background="transparent" speed="1" autoplay></lottie-player>
        <h2 id="status-text">Server Timeout</h2>
        <a href="https://gplmods.webredirect.org/home" class="fallback-btn" id="fallback-btn">Proceed Manually</a>
    </div>
  
    <!-- ======== ADD THE FLOATING MUSIC PLAYER HERE ======== -->
    <div id="floating-music-player" class="floating-music-player"> <!-- Adding "open" initially is up to you -->
        <button id="music-toggle-btn" class="music-toggle-btn" title="Toggle Music Player">
            <i class="fas fa-music"></i>
        </button>
        
        <div class="music-player-content">
            <span id="music-track-name" class="track-name">Loading...</span>
            
            <div class="music-controls">
                <button id="music-prev-btn" class="music-btn"><i class="fas fa-step-backward"></i></button>
                <button id="music-play-pause-btn" class="music-btn"><i class="fas fa-play" id="play-pause-icon"></i></button>
                <button id="music-next-btn" class="music-btn"><i class="fas fa-step-forward"></i></button>
            </div>
            
            <div class="timeline-container">
                <span id="music-current-time">0:00</span>
                <input type="range" id="music-timeline" min="0" max="100" value="0" step="1">
                <span id="music-duration">0:00</span>
            </div>

            <div class="volume-container">
                <i class="fas fa-volume-down volume-icon"></i>
                <input type="range" id="music-volume-slider" min="0" max="1" step="0.01" value="0.25">
                <i class="fas fa-volume-up volume-icon"></i>
            </div>
        </div>
        
        <audio id="background-audio" loop></audio>
        <div id="yt-player-container" style="position: absolute; width: 0; height: 0; pointer-events: none; opacity: 0;"></div>
    </div>
    <!-- =================================================== -->

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <!-- App Logic -->
    <script src="/js/app.js"></script>
</body>
</html>
